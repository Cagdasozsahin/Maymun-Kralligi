<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MAYMUN KRALLIĞI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#f2c14e; --gold2:#ffdf8a; --gold-d:#9a6b16;
  --ink:#07090a; --panel:rgba(12,16,14,.72); --line:rgba(242,193,78,.28);
  --txt:#efe6cf; --mut:#a59c86; --accent:#f2c14e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt);font-family:'Rajdhani',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ================= SPLASH ================= */
#splash{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#000;transition:opacity 1.1s ease, visibility 1.1s}
#splash.hide{opacity:0;visibility:hidden}
#splash #cover,#splash .splash-title,#splash .halo,#splash .loader{transition:opacity .7s ease}
#splash.wait #cover,#splash.wait .splash-title,#splash.wait .halo,#splash.wait .loader{opacity:0}
#coverBg{position:absolute;inset:-40px;background-position:center;background-size:cover;filter:blur(28px) brightness(.45) saturate(1.2);display:none}
#splash.has-img #coverBg{display:block}
#cover{position:absolute;inset:0;background-position:center;background-size:contain;background-repeat:no-repeat;animation:pulse 3.2s ease-in-out infinite;transform-origin:center}
#cover.img{animation:pulse 3.2s ease-in-out infinite, drift 24s ease-in-out infinite alternate}
@keyframes pulse{0%,100%{filter:brightness(1) saturate(1.05)}50%{filter:brightness(.72) saturate(.9)}}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.025)}}
#fallbackArt{position:absolute;inset:0;width:100%;height:100%}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.85) 100%)}
.splash-title{position:absolute;top:13%;left:0;right:0;text-align:center;pointer-events:none}
.splash-title h1{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(38px,8vw,112px);letter-spacing:.04em;line-height:.95;
  background:linear-gradient(180deg,#fff6d6 0%,#f7cf62 38%,#b67a12 70%,#f2c14e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(60,30,0,.65)) drop-shadow(0 0 28px rgba(242,193,78,.35));animation:titleGlow 3.2s ease-in-out infinite}
.splash-title p{margin-top:14px;font-family:'Cinzel',serif;letter-spacing:.55em;font-size:clamp(11px,1.3vw,16px);color:#e7d6a8;opacity:.85}
@keyframes titleGlow{50%{filter:drop-shadow(0 6px 0 rgba(60,30,0,.65)) drop-shadow(0 0 10px rgba(242,193,78,.12))}}

.loader{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:min(560px,84vw);text-align:center}
.loader .lbl{display:flex;justify-content:space-between;font-family:'Cinzel',serif;font-size:13px;letter-spacing:.28em;color:#f3e3b5;margin-bottom:10px;text-shadow:0 2px 6px #000}
.bar{position:relative;height:14px;border-radius:2px;background:rgba(0,0,0,.65);border:1px solid rgba(242,193,78,.55);box-shadow:0 0 0 3px rgba(0,0,0,.55),0 0 24px rgba(242,193,78,.15) inset;overflow:hidden;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%)}
.bar i{position:absolute;inset:2px auto 2px 2px;width:0;background:linear-gradient(90deg,#7a4c08,#f2c14e 60%,#fff1bd);box-shadow:0 0 16px #f2c14e;transition:width .25s ease}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);background-size:60px 100%;animation:shine 1.2s linear infinite}
@keyframes shine{from{background-position:-60px 0}to{background-position:600px 0}}
.tip{margin-top:14px;font-size:15px;color:#d8cba9;min-height:20px;text-shadow:0 2px 6px #000;transition:opacity .4s}
.press{margin-top:6px;font-family:'Cinzel',serif;letter-spacing:.35em;font-size:14px;color:var(--gold2);opacity:0;transition:opacity .6s}
.press.on{opacity:1;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* ================= SELECT (mobil öncelikli grid) ================= */
#app{position:fixed;inset:0;opacity:0;transition:opacity 1.2s ease;display:grid;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:#050706;
  grid-template-columns:1fr;
  grid-template-rows:auto auto minmax(0,1fr) auto auto auto;
  grid-template-areas:"top" "head" "stage" "details" "roster" "cta"}
#app.show{opacity:1}
.topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 6px}
.brand{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:15px;letter-spacing:.05em;white-space:nowrap;background:linear-gradient(180deg,#fff2c4,#e0a93a);-webkit-background-clip:text;background-clip:text;color:transparent}
.crumb{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.24em;color:var(--mut);white-space:nowrap}
.crumb b{color:var(--gold)}

.head{grid-area:head;text-align:center;padding:4px 16px 0}
.role{display:inline-block;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#111;background:var(--accent);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.head h2{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:30px;line-height:1.05;margin-top:6px;letter-spacing:.03em;color:#fff6dd;text-shadow:0 0 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.head .title{font-family:'Cinzel',serif;font-size:12px;color:var(--mut);letter-spacing:.14em;margin-top:2px}

.stagewrap{grid-area:stage;position:relative;min-height:0;min-width:0}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
#stage:active{cursor:grabbing}
.stagewrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 75% at 50% 50%,transparent 60%,#050706 100%)}
.hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;letter-spacing:.2em;color:rgba(239,230,207,.38);pointer-events:none;text-transform:uppercase}
.nav{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(0,0,0,.55);color:var(--gold);font-size:22px;line-height:1;border-radius:50%;transition:background .2s,color .2s;z-index:2}
.nav:hover,.nav:active{background:var(--gold);color:#111}
#prev{left:10px} #next{right:10px}

.details{grid-area:details;margin:0 12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.details .desc{display:none;font-size:15px;line-height:1.45;color:#d9d0b8;font-weight:500;margin-bottom:12px}
#cStats{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.stat{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:3px 8px;align-items:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#cfc4a8;font-weight:700}
.stat .k{grid-column:1}
.stat .v{grid-column:2;text-align:right;color:#fff}
.stat .tr{grid-column:1 / -1;height:5px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.stat .tr i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 45%,#000),var(--accent));box-shadow:0 0 8px var(--accent);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.skill{margin-top:10px;padding:7px 10px;border-left:2px solid var(--accent);background:rgba(255,255,255,.04)}
.skill small{display:block;font-size:10px;letter-spacing:.28em;color:var(--accent);font-weight:700}
.skill span{display:block;margin-top:2px;font-size:13px;line-height:1.3;color:#e9e0c8;font-weight:600}

.roster{grid-area:roster;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 12px 0}
.card{position:relative;aspect-ratio:1/1.05;border:1px solid rgba(255,255,255,.1);background:#0d0f0d;overflow:hidden;border-radius:6px;transition:transform .2s,border-color .2s,box-shadow .2s}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;opacity:.6;transition:opacity .2s}
.card .nm{position:absolute;left:0;right:0;bottom:0;padding:10px 2px 3px;text-align:center;font-family:'Cinzel',serif;font-weight:800;font-size:9.5px;letter-spacing:.06em;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);white-space:nowrap}
.card.active{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 18px -4px var(--c);transform:translateY(-3px)}
.card.active img{opacity:1}

.cta{grid-area:cta;display:flex;justify-content:center;padding:12px 12px 14px}
.go{width:100%;max-width:420px;min-height:52px;font-family:'Cinzel',serif;font-weight:800;font-size:17px;letter-spacing:.26em;color:#1a1004;
  background:linear-gradient(180deg,#ffe9a6,#f2c14e 45%,#b9801a);box-shadow:0 0 0 1px #ffe8a0 inset,0 8px 24px -8px rgba(242,193,78,.6);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);transition:transform .15s,filter .2s}
.go:hover{filter:brightness(1.1)} .go:active{transform:scale(.98)}

/* ---- Yatay ekran (telefon yatay, tablet, PC) ---- */
@media (orientation:landscape) and (min-width:640px){
  #app{grid-template-columns:auto minmax(0,1fr) minmax(250px,30%);
    grid-template-rows:auto auto minmax(0,1fr) auto;
    grid-template-areas:"top top top" "roster stage head" "roster stage details" "roster cta details"}
  .topbar{padding:12px 20px 4px}
  .head{text-align:left;padding:8px 16px 0 4px;align-self:end}
  .details{margin:10px 16px 14px 4px;align-self:start;max-height:100%;overflow:auto}
  #cStats{grid-template-columns:1fr}
  .roster{grid-template-columns:1fr;grid-auto-rows:min-content;align-content:center;gap:8px;padding:8px 0 12px 16px;overflow:auto}
  .card{width:clamp(56px,11vh,92px)}
  .card .nm{font-size:clamp(8px,1.4vh,11px)}
  .card.active{transform:translateX(4px)}
  .cta{padding:6px 12px 14px}
  .go{max-width:340px}
}
@media (orientation:landscape) and (min-width:640px) and (min-height:560px){
  .brand{font-size:20px}.crumb{font-size:12px}
  .head h2{font-size:38px}.head .title{font-size:14px}
  .details{padding:18px 20px}
  .details .desc{display:block}
  .stat{font-size:12px}
  .skill span{font-size:14px}
}
@media (orientation:landscape) and (max-height:430px){
  .head h2{font-size:24px}.head .title{display:none}
  .details{padding:10px 12px;margin-top:6px}
  .skill{display:none}
  .go{min-height:44px;font-size:15px}
  .hint{display:none}
}
@media (hover:none){ .hint-desk{display:none} }
@media (hover:hover){ .hint-touch{display:none} }

/* chapter modal */
#chapters{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:.4s}
#chapters.show{opacity:1;visibility:visible}
.koybtn{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;margin:12px 0 4px;padding:14px 12px;border:1px solid rgba(242,193,78,.7);cursor:pointer;color:#fff;
  background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.2),rgba(0,0,0,.55)),url(tex_koy/card.jpg) center/cover;box-shadow:0 0 22px -6px rgba(242,193,78,.6)}
.koybtn .kb-t{font:900 clamp(16px,3.4vw,22px) 'Cinzel Decorative',serif;letter-spacing:.06em;background:linear-gradient(180deg,#fff2c4,#e0a93a);-webkit-background-clip:text;background-clip:text;color:transparent}
.koybtn .kb-s{font:700 12px 'Rajdhani',sans-serif;letter-spacing:.12em;color:#e8dcc0}
.koybtn:active{transform:scale(.98)}
.chbox{width:min(1080px,94vw);text-align:center}
.chbox h3{font-family:'Cinzel Decorative',serif;font-size:clamp(26px,3.4vw,40px);color:var(--gold2)}
.chbox p.sub{margin:8px 0 28px;color:var(--mut);letter-spacing:.2em;font-size:14px}
.chs{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.ch{position:relative;aspect-ratio:3/4;padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);background:var(--bg);overflow:hidden;transition:.25s}
.ch::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.9))}
.ch>*{position:relative;z-index:1}
.ch small{font-size:12px;letter-spacing:.3em;color:var(--gold)}
.ch b{display:block;font-family:'Cinzel',serif;font-size:17px;margin-top:4px;color:#fff3d4}
.ch.lock{filter:grayscale(.85) brightness(.55)}
.ch.lock::before{content:"🔒";position:absolute;top:12px;right:12px;z-index:2;font-size:18px}
.ch:not(.lock):hover{transform:translateY(-6px);box-shadow:0 14px 40px -12px var(--gold)}
.close{margin-top:26px;font-size:14px;letter-spacing:.3em;color:var(--mut)}
.close:hover{color:#fff}
.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);z-index:40;padding:12px 22px;background:rgba(10,10,8,.92);border:1px solid var(--gold);font-weight:600;letter-spacing:.1em;opacity:0;transition:.35s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .chs{grid-template-columns:repeat(5,minmax(140px,1fr));overflow-x:auto;padding-bottom:8px;text-align:left}
}
}

/* kapak resmi varken: resim üstte, başlık altında */
#splash.has-img{background:radial-gradient(ellipse at 50% 38%, #2a1d07 0%, #000 62%)}
#splash.has-img #coverBg{display:none}
#splash.has-img #cover{inset:4vh 0 auto 0;height:54vh;mix-blend-mode:screen}
#splash.has-img .splash-title{display:block;top:auto;bottom:calc(8% + 120px)}
#splash.has-img .splash-title h1{font-size:clamp(30px,5.2vw,72px);line-height:1}
#splash.has-img .splash-title h1 br{display:none}
.halo{position:absolute;left:50%;top:31vh;width:70vh;height:70vh;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle, rgba(242,193,78,.22), transparent 62%);animation:halo 3.2s ease-in-out infinite;pointer-events:none;display:none}
#splash.has-img .halo{display:block}
@keyframes halo{50%{opacity:.35;transform:translate(-50%,-50%) scale(.94)}}
@media (max-width:860px){#splash.has-img #cover{height:44vh;top:8vh}.halo{top:30vh;width:60vh;height:60vh}#splash.has-img .splash-title{bottom:calc(8% + 150px)}#splash.has-img .splash-title h1 br{display:block}.loader .lbl{letter-spacing:.12em;font-size:11px}}

#bSndM{margin-left:auto}#bSndM+.bagm{margin-left:2px}#bSndM svg{display:block;margin:auto}
.bagm{position:relative;margin-left:auto;width:42px;height:42px;padding:0;border:0;background:none;cursor:pointer;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.bagm img{width:100%;height:100%;display:block}.bagm i{position:absolute;right:-4px;top:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#e2422a;color:#fff;font:700 11px/18px sans-serif;font-style:normal;text-align:center}
.bagm:active{transform:scale(.92)}

/* ---------- PROFİL ---------- */
.prof{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border-radius:30px;background:rgba(0,0,0,.45);border:1px solid rgba(242,193,78,.4);cursor:pointer;color:#f3e3b5;max-width:46vw}
.prof img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--gold,#f2c14e);background:#1a140c}
.prof b{font:700 13px 'Cinzel',serif;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:10px;min-width:0}
#profile{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:.35s}
#profile.show{opacity:1;visibility:visible}
.pf-card{width:min(94vw,720px);max-height:92vh;overflow:auto;padding:22px 20px 20px;border:1px solid rgba(242,193,78,.45);background:linear-gradient(180deg,rgba(40,30,14,.95),rgba(12,9,5,.97));box-shadow:0 20px 60px rgba(0,0,0,.7);position:relative}
.pf-card h2{margin:0 0 4px;text-align:center;font:900 clamp(20px,4vw,28px) 'Cinzel Decorative',serif;background:linear-gradient(180deg,#fff2c4,#e0a93a);-webkit-background-clip:text;background-clip:text;color:transparent}
.pf-card .sub{text-align:center;color:#b9ab88;font-size:13px;margin-bottom:16px}
.pf-top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.pf-big{width:96px;height:96px;flex:none;border-radius:50%;border:3px solid #f2c14e;box-shadow:0 0 22px rgba(242,193,78,.4);background:#1a140c;object-fit:cover}
.pf-name{flex:1;min-width:0}
.pf-name label{display:block;font:700 11px 'Cinzel',serif;letter-spacing:.25em;color:#f2c14e;margin-bottom:6px}
.pf-name input{width:100%;box-sizing:border-box;padding:12px 14px;font:700 18px 'Rajdhani',sans-serif;color:#fff;background:rgba(0,0,0,.5);border:1px solid rgba(242,193,78,.5);outline:none}
.pf-name input:focus{border-color:#f2c14e;box-shadow:0 0 0 2px rgba(242,193,78,.25)}
.pf-err{color:#ff7a5a;font-size:12px;min-height:16px;margin-top:4px}
.pf-grp{font:700 11px 'Cinzel',serif;letter-spacing:.25em;color:#c9b88a;margin:12px 0 8px}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.pf-av{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.08);background:radial-gradient(circle at 50% 35%,#3a2c16,#120d06);cursor:pointer;padding:0}
.pf-av img{width:100%;height:100%;object-fit:cover;display:block}
.pf-av span{position:absolute;left:0;right:0;bottom:0;padding:2px 0;font:700 9px 'Rajdhani',sans-serif;letter-spacing:.05em;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.85));text-align:center}
.pf-av.sel{border-color:#f2c14e;box-shadow:0 0 14px rgba(242,193,78,.6)}
.pf-av:active{transform:scale(.95)}
.pf-go{display:block;margin:18px auto 0;padding:12px 40px;font:800 15px 'Cinzel',serif;letter-spacing:.18em;color:#1a1004;border:0;cursor:pointer;background:linear-gradient(180deg,#ffe9a6,#f2c14e 45%,#b9801a);clip-path:polygon(6% 0,94% 0,100% 50%,94% 100%,6% 100%,0 50%)}
.pf-x{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid #f2c14e;background:#1b1410;color:#f2c14e;font:800 18px sans-serif;cursor:pointer}
@media (max-width:700px){.topbar .crumb{display:none}.topbar{min-width:0}.brand{font-size:14px!important}}
@media (max-width:520px){.pf-big{width:76px;height:76px}.prof b{max-width:24vw;font-size:12px}.prof{padding-right:10px}.pf-grid{grid-template-columns:repeat(4,1fr)}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}

<body>

<!-- ============ AÇILIŞ / YÜKLEME ============ -->
<section id="splash" class="has-img wait">
  <div id="coverBg"></div>
  <div class="halo"></div>
  <div id="cover"></div>
  <svg id="fallbackArt" style="display:none" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <radialGradient id="sky" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#5a3a0c"/><stop offset=".35" stop-color="#221608"/><stop offset="1" stop-color="#040504"/></radialGradient>
      <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe7a0"/><stop offset=".25" stop-color="#f2b33c" stop-opacity=".9"/><stop offset="1" stop-color="#f2b33c" stop-opacity="0"/></radialGradient>
      <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000"/></linearGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#sky)"/>
    <circle cx="800" cy="360" r="330" fill="url(#sun)" opacity=".75"/>
    <path d="M0 640 L180 470 L300 560 L460 380 L620 540 L800 300 L980 540 L1140 390 L1300 560 L1420 470 L1600 620 V900 H0Z" fill="#1a1207" opacity=".9"/>

<script id="mks">
/* =================== SES (MKS) =================== */
// Yalnızca ses/ klasöründeki dosyalar çalınır (önce .mp3, yoksa .json içinde base64).
// Mod: menü (index), bölüm (bolumN), köy (koy). window.MKS_MODE ile zorlanabilir.
const MKS = (() => {
  const MODE = window.MKS_MODE || (/koy/.test(location.pathname) ? 'koy' : /bolum/.test(location.pathname) ? 'game' : 'menu');
  const CH = +((location.pathname.match(/bolum(\d)/) || [])[1] || 0), BED = { 2: 'fon_2', 3: 'fon_3', 4: 'fon_4', 5: 'fon_5' }[CH] || 'korku';
  let ctx = null, master = null, musBus = null, ambBus = null, sfxBus = null, on = (() => { try { return localStorage.getItem('mk_sound') !== '0'; } catch(e){ return true; } })(), started = false;
  const buf = {}, pend = {};
  const rnd = (a, b) => a + Math.random() * (b - a);
  // oyuncu ve canavar ölüm sesleri tek dosya; her karaktere ayrı perde
  const HERO_RATE = { azrak: 1, razor: 1.1, thorgar: .84, shadow: 1.05, grimkar: .9 };
  const MON_RATE = { kancitran: 1.18, shadow_arrow: 1.06, head_crusher: .86, golyat: .74, black_magic: .95, white_devil: 1.12,
    king_gorgor: .72, king_zarkov: .68, king_slyvan: .9, vampire_king: .8, king_malakor: .64 };
  const LAUGH_RATE = { king_gorgor: .9, king_zarkov: .84, king_slyvan: 1.08, vampire_king: 1, king_malakor: .8 };
  const WEAPON = { '1h': 'vurus_kilic', dual: 'vurus_kilic', '2h': 'vurus_topuz', flail: 'vurus_topuz', bow: 'ok', orb: 'ok' };

  async function fetchBuf(name){
    try { const r = await fetch('ses/' + name + '.mp3'); if (r.ok){ const ab = await r.arrayBuffer(); if (ab.byteLength > 1000) return await ctx.decodeAudioData(ab); } } catch(e){}
    try { const r = await fetch('ses/' + name + '.json'); if (r.ok){ const j = await r.json(), s = atob(j.b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return await ctx.decodeAudioData(u.buffer); } } catch(e){}
    return null; }
  function get(name){ if (buf[name] !== undefined) return Promise.resolve(buf[name]); return pend[name] || (pend[name] = fetchBuf(name).then(b => buf[name] = b)); }

  function play(b, { vol = 1, pan = 0, rate = 1, bus = sfxBus, loop = false } = {}){ if (!ctx || !b) return null;
    const s = ctx.createBufferSource(); s.buffer = b; s.playbackRate.value = rate;
    if (loop){ s.loop = true; s.loopStart = 0; s.loopEnd = b.duration; }
    const g = ctx.createGain(); g.gain.value = vol; const p = ctx.createStereoPanner(); p.pan.value = pan;
    s.connect(g); g.connect(p); p.connect(bus); s.start(); return { s, g }; }
  async function sfx(name, o = {}){ if (!ctx || !on) return; const b = await get(name); return play(b, o); }

  // müzik / zemin kanalı: yumuşak geçişli tek döngü
  let cur = null, curName = null;
  async function music(name, { vol = .7, fade = 1.2, loop = true, onend } = {}){ if (!ctx) return; if (name === curName && cur) return;
    curName = name; const old = cur; cur = null;
    if (old){ const t = ctx.currentTime; old.g.gain.cancelScheduledValues(t); old.g.gain.setValueAtTime(old.g.gain.value, t); old.g.gain.linearRampToValueAtTime(0, t + fade); setTimeout(() => { try { old.s.stop(); } catch(e){} }, fade * 1000 + 100); }
    if (!name) return; const b = await get(name); if (!b || curName !== name) return;
    const n = play(b, { vol: 0, bus: musBus, loop }); const t = ctx.currentTime; n.g.gain.setValueAtTime(0, t); n.g.gain.linearRampToValueAtTime(vol, t + fade); cur = n;
    if (onend) n.s.onended = () => { if (cur === n){ cur = null; curName = null; onend(); } }; }
  function duck(v = .35, sec = 2.5){ if (!ctx) return; const t = ctx.currentTime; musBus.gain.cancelScheduledValues(t); musBus.gain.setValueAtTime(musBus.gain.value, t); musBus.gain.linearRampToValueAtTime(v, t + .3); musBus.gain.linearRampToValueAtTime(1, t + .3 + sec); }

  // ara sıra gelen ortam sesleri (rüzgar, kurt, hayalet, ıslık)
  const EVENTS = { game: [['ruzgar', .55, 3], ['kurt', .42, 2], ['hayalet', .36, 2], ['islik', .3, 1], ['ara', .5, 2]], koy: [], menu: [] };
  let last = '';
  function ambLoop(){ const ev = EVENTS[MODE]; if (!ev.length) return;
    const go = () => { if (on && !document.hidden && !bossOn){ const pool = ev.filter(e => e[0] !== last), tot = pool.reduce((a, e) => a + e[2], 0); let r = Math.random() * tot, pick = pool[0];
        for (const e of pool){ r -= e[2]; if (r <= 0){ pick = e; break; } } last = pick[0];
        sfx(pick[0], { vol: pick[1] * rnd(.75, 1), pan: rnd(-.85, .85), rate: rnd(.94, 1.04), bus: ambBus }); }
      setTimeout(go, rnd(14000, 30000)); };
    setTimeout(go, rnd(5000, 9000)); }

  let bossOn = false;
  function startMode(){
    if (MODE === 'menu') music('acilis', { vol: .8, fade: .4, loop: false, onend: () => music('bekleme', { vol: .6, fade: 1.5 }) });
    else if (MODE === 'koy') music('koy_fon', { vol: .6, fade: 2 });
    else music(bossOn ? 'boss_muzik' : BED, { vol: bossOn ? .62 : .5, fade: 2 });
    ambLoop(); if (window.__mksPrewarm) MKS.prewarm(window.__mksPrewarm); }
  function unlock(){ if (started){ if (ctx && ctx.state === 'suspended') ctx.resume(); return; } started = true;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
    master = ctx.createGain(); master.gain.value = on ? .9 : 0; master.connect(ctx.destination);
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 4; comp.connect(master);
    musBus = ctx.createGain(); ambBus = ctx.createGain(); sfxBus = ctx.createGain(); for (const b of [musBus, ambBus, sfxBus]) b.connect(comp);
    if (ctx.state === 'suspended') ctx.resume(); startMode(); }
  ['pointerdown', 'keydown', 'touchstart', 'click'].forEach(ev => addEventListener(ev, unlock, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (!ctx) return; document.hidden ? ctx.suspend() : (on && ctx.resume()); });

  return {
    unlock, music, sfx, duck, get mode(){ return MODE; },
    get on(){ return on; },
    toggle(v){ on = v === undefined ? !on : v; try { localStorage.setItem('mk_sound', on ? '1' : '0'); } catch(e){} if (master) master.gain.setTargetAtTime(on ? .9 : 0, ctx.currentTime, .1); return on; },
    heroDeath(id){ duck(.25, 4); sfx('olum_oyuncu', { vol: 1, rate: HERO_RATE[id] || 1 }); },
    enemyDeath(id){ const king = /^(king|vampire)/.test(id); sfx('olum_canavar', { vol: king ? 1.25 : .8, rate: (MON_RATE[id] || 1) * (king ? 1 : rnd(.96, 1.04)) }); if (king) duck(.4, 3); },
    bossLaugh(id){ duck(.3, 3.5); sfx('gulus_boss', { vol: 1.3, rate: LAUGH_RATE[id] || 1 }); },
    bossFight(v){ bossOn = v; if (ctx) music(v ? 'boss_muzik' : BED, { vol: v ? .62 : .4, fade: v ? 1.5 : 3 }); },
    weapon(type, combo){ const n = WEAPON[type]; if (n) sfx(n, { vol: n === 'ok' ? .7 : .65, rate: rnd(.95, 1.05) * (combo === 2 ? .92 : 1) }); },
    gate(open){ sfx('kapi', { vol: open ? .8 : .55, rate: open ? 1 : .9 }); },
    nightWarn(){ sfx('koy_gece', { vol: .8, bus: ambBus }); },
    prewarm(){ if (!ctx) return; const L = MODE === 'menu' ? ['bekleme'] : MODE === 'koy' ? ['kapi', 'vurus_kilic', 'vurus_topuz', 'ok', 'olum_oyuncu', 'olum_canavar'] :
        ['vurus_kilic', 'vurus_topuz', 'ok', 'olum_oyuncu', 'olum_canavar', 'gulus_boss', 'boss_muzik', 'ruzgar', 'kurt', 'hayalet', 'islik', 'ara'];
      let t = 200; for (const n of L){ setTimeout(() => get(n), t); t += 150; } },
  };
})();
</script>

function prepare(c, gltf){
  const root = gltf.scene;
  root.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
    const m=o.material; if(m){ m.envMapIntensity = 0.5; if(m.map) m.map.anisotropy = renderer.capabilities.getMaxAnisotropy(); } } });
  // boyu ~1.0 birime normalize et
  const box = new THREE.Box3().setFromObject(root); const h = box.max.y - box.min.y || 1;
  root.scale.setScalar(1.0 / h); root.position.y = -box.min.y / h;
  const mixer = new THREE.AnimationMixer(root); const actions = {};
  for (const clip of gltf.animations){ actions[clip.name] = mixer.clipAction(clip); }
  ['Jump','Attack','Attack1','Attack2','Attack3','JumpStart','JumpLand','Roll','Hit','Death'].forEach(n => { const a=actions[n]; if(a){ a.setLoop(THREE.LoopOnce,1); a.clampWhenFinished = true; } });
  root.visible = false; holder.add(root);
  return { c, root, mixer, actions, current:null };
}

  r.setSize(W,H); r.outputColorSpace=THREE.SRGBColorSpace; r.toneMapping=THREE.ACESFilmicToneMapping;
  const s = new THREE.Scene(); s.environment = scene.environment;
  s.add(new THREE.HemisphereLight(0xffe6b0,0x112211,1.1));
  const d = new THREE.DirectionalLight(0xffffff,2.2); d.position.set(1,2,3); s.add(d);
  const cam = new THREE.PerspectiveCamera(24, W/H, 0.05, 20); cam.position.set(0.15,0.86,1.75); cam.lookAt(0,0.74,0);
  for (const u of units){
    const bg = new THREE.Color(u.c.color).multiplyScalar(0.22); s.background = bg;
    const rr = new THREE.PointLight(new THREE.Color(u.c.color), 6, 4); rr.position.set(-0.8,1.3,-0.8); s.add(rr);
    const parent = u.root.parent; s.add(u.root); u.root.visible = true;
    u.actions.Idle?.play(); u.mixer.update(0.6);
    r.render(s, cam); u.c.portrait = r.domElement.toDataURL('image/webp', .9);
    u.actions.Idle?.stop(); u.root.visible=false; parent.add(u.root); s.remove(rr);
  }
  r.dispose(); r.forceContextLoss?.();
}

/* ---------- UI kurulumu ---------- */
let idx = 0, active = null, swapT = 1, turn = 0, turnVel = 0;
function buildUI(){
  $('#roster').innerHTML = CHARACTERS.map((c,i)=>`
    <button class="card" data-i="${i}" style="--c:${c.color}">
      <img src="${c.portrait||''}" alt=""><span class="nm">${c.name}</span>
    </button>`).join('');
  $('#roster').onclick = e => { const b=e.target.closest('.card'); if(b) select(+b.dataset.i); };
  $('#prev').onclick = () => select((idx+CHARACTERS.length-1)%CHARACTERS.length);
  $('#next').onclick = () => select((idx+1)%CHARACTERS.length);
  addEventListener('keydown', e => { if(!$('#app').classList.contains('show')) return;
    if(e.key==='ArrowRight') $('#next').click(); if(e.key==='ArrowLeft') $('#prev').click();
    if(e.key==='Enter') $('#go').click(); if(e.key==='Escape') closeChapters(); });
  $('#go').onclick = openChapters; $('#chClose').onclick = closeChapters;
  // TEST AŞAMASI: hazır bölümlerin hepsi açık. Yayında ilerlemeye bağlamak için TEST_OPEN=false yap.
  const TEST_OPEN = true, READY = 5;
  let done = 0; try { if (localStorage.getItem('mk_bolum1')) done = 1; if (localStorage.getItem('mk_bolum2')) done = 2; if (localStorage.getItem('mk_bolum3')) done = 3; } catch(e){}
  const isOpen = i => i < READY && (TEST_OPEN || i <= done);
  $('#chs').innerHTML = CHAPTERS.map((ch,i)=>`<button class="ch ${isOpen(i)?'':'lock'}" data-i="${i}" style="--bg:${ch.bg}"><small>BÖLÜM ${ch.n}</small><b>${ch.name}</b>${isOpen(i)?`<small style="display:block;margin-top:4px;letter-spacing:.2em">${i<done?'✓ TAMAMLANDI · ':''}OYNA ▸</small>`:''}</button>`).join('');
  $('#chs').onclick = e => { const b=e.target.closest('.ch'); if(!b) return;
    if (b.classList.contains('lock')) { toast(+b.dataset.i < READY ? 'Bu bölüm, önceki bölümü tamamlayınca açılır.' : 'Bu bölüm yakında geliyor.'); return; }
    location.href = 'bolum' + (+b.dataset.i + 1) + '.html#' + CHARACTERS[idx].id; };
}
function openChapters(){ $('#chSub').textContent = `KAHRAMAN: ${CHARACTERS[idx].name} · ${CHARACTERS[idx].role.toUpperCase()}`; $('#chapters').classList.add('show'); play(active?.actions.Attack1 ? 'Attack1' : 'Attack'); }
$('#bKoy').addEventListener('click', () => { location.href = 'koy.html#' + CHARACTERS[idx].id; });
function closeChapters(){ $('#chapters').classList.remove('show'); }
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2400); }

function select(i){
  idx = i; const u = units[i], c = u.c;
  document.querySelectorAll('.card').forEach((b,k)=>b.classList.toggle('active', k===i));
  document.documentElement.style.setProperty('--accent', c.color);
  $('#cRole').textContent = c.role; $('#cName').textContent = c.name; $('#cTitle').textContent = c.title;
  $('#cDesc').textContent = c.desc; $('#cSkill').textContent = c.skill;
  $('#cStats').innerHTML = Object.entries(c.stats).map(([k,v])=>`<div class="stat"><span class="k">${k}</span><span class="v">${v}</span><div class="tr"><i data-v="${v}"></i></div></div>`).join('');
  requestAnimationFrame(()=>document.querySelectorAll('.stat i').forEach(el=>el.style.width=el.dataset.v+'%'));
  if (active && active !== u){ active.root.visible = false; active.mixer.stopAllAction(); }
  active = u; u.root.visible = true; swapT = 0; turn = 0; turnVel = 0;
  const col = new THREE.Color(c.color);
  ringMat.color.copy(col); glowMat.color.copy(col); burstMat.color.copy(col); rim.color.copy(col);
  burstMat.opacity = 1; burst.scale.setScalar(1);
  u.current = null; play('Idle', 0);
}

function play(name, fade=0.25){
  const u = active; if(!u) return; const next = u.actions[name]; if(!next) return;
  next.reset(); next.setEffectiveWeight(1); next.play();
  if (u.current && u.current !== next) u.current.crossFadeTo(next, fade, false);
  u.current = next;
  if (next.loop === THREE.LoopOnce){
    const back = () => { if (u.current === next) play('Idle', 0.35); };
    const dur = next.getClip().duration * 1000 + (name==='Death'?1400:80);
    clearTimeout(u._t); u._t = setTimeout(back, dur);
  }
}

/* ---------- Sürükleyerek döndürme ---------- */
let dragging=false, lastX=0;
canvas.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e=>{ if(!dragging) return; const dx=e.clientX-lastX; lastX=e.clientX; turnVel = dx*0.012; turn += turnVel; });
canvas.addEventListener('pointerup', ()=>dragging=false);
canvas.addEventListener('pointercancel', ()=>dragging=false);

/* ---------- Yeniden boyutlandırma ---------- */
const wrap = document.getElementById('stageWrap');
function resize(){
  const w = Math.max(1, wrap.clientWidth), h = Math.max(1, wrap.clientHeight);
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = 30;
  // karakter (~1.12 birim boy) + kaide (~1.4 birim en) her zaman sığsın
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const needH = 1.32, needW = 1.55;
  const dist = Math.max((needH/2)/t, (needW/2)/(t*camera.aspect)) + 0.4;
  camera.position.set(0, 0.62 + dist*0.06, dist);
  camTarget.set(0, 0.58, 0);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap); addEventListener('resize', resize); resize();

/* ---------- Döngü ---------- */
const clock = new THREE.Clock();
function loop(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (active){
    active.mixer.update(dt);
    swapT = Math.min(1, swapT + dt*2.2); const e = 1 - Math.pow(1-swapT, 3);
    active.root.scale.setScalar(active.root.userData.s ??= active.root.scale.x);
    active.root.scale.setScalar(active.root.userData.s * (0.86 + 0.14*e));
    if (!dragging){ turnVel *= 0.93; turn += turnVel; turn *= 0.985; }
    holder.rotation.y = turn + Math.sin(t*0.35)*0.12;
  }
  burstMat.opacity *= 0.94; burst.scale.multiplyScalar(1.025);
  ringMat.opacity = 0.65 + Math.sin(t*2.4)*0.25;
  glowMat.opacity = 0.42 + Math.sin(t*1.7)*0.1;
  const pa = pGeo.attributes.position.array;
  for (let i=0;i<PN;i++){ pa[i*3+1] += dt*(0.05+0.04*Math.sin(pSeed[i])); pa[i*3] += Math.sin(t*0.6+pSeed[i])*dt*0.03; if(pa[i*3+1]>2.7) pa[i*3+1]=0; }
  pGeo.attributes.position.needsUpdate = true;
  pMat.opacity = 0.75 + Math.sin(t*3)*0.15;
  camera.position.x = Math.sin(t*0.2)*0.06;
  camera.lookAt(camTarget);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* ---------- Akış: yükle → karakter ekranı ---------- */
let finished = false;
function done(){
  if (finished) return; finished = true; clearInterval(tipTimer);
  $('#ldText').textContent = 'KRALLIK HAZIR'; $('#press').classList.add('on');
  const go = () => { removeEventListener('keydown', go); $('#splash').removeEventListener('click', go);
    $('#splash').classList.add('hide'); $('#app').classList.add('show'); if (!localStorage.getItem('mk_profile')) setTimeout(() => openProfile(true), 700); };
  $('#splash').addEventListener('click', go); addEventListener('keydown', go);
  setTimeout(go, 2200);
}
const minTime = sleep(3200);
loadAll().then(async () => {
  buildUI(); select(0); loop();
  // ilk karede shader derlemesi takılmasın
  units.forEach(u=>u.root.visible=true); renderer.compile(scene,camera); units.forEach((u,i)=>u.root.visible=(i===0));
  await minTime; window.__ready = true;
}).catch(err => { console.error(err); $('#ldText').textContent = 'YÜKLEME HATASI'; tipEl.textContent = err.message; });
</script>
